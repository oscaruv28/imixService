<div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 font-sans text-slate-900">
  
  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-8 sm:p-10 animate-in fade-in zoom-in-95 duration-300">
    
    <div class="flex flex-col items-center mb-10">
      <div class="flex size-14 items-center justify-center rounded-2xl bg-slate-950 text-white shadow-sm mb-5">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 2h10"></path>
          <path d="M5 6h14"></path>
          <rect width="18" height="12" x="3" y="10" rx="2"></rect>
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tighter text-slate-900 leading-tight">InclusionScore AI</h1>
      <p class="text-sm font-medium text-slate-500 mt-1 text-center">Acceso seguro para Corresponsales</p>
    </div>

    <div class="space-y-6">
      <div class="group">
        <label class="block text-[12px] font-bold text-slate-400 uppercase tracking-wider ml-1 mb-2 group-focus-within:text-slate-900 transition-colors">Usuario</label>
        <input type="text" [(ngModel)]="username" 
          class="w-full h-11 rounded-lg border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-900 placeholder:text-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-950 focus:bg-white transition-all"
          placeholder="Nombre de usuario">
      </div>

      <div class="group">
        <div class="flex items-center justify-between mb-2">
          <label class="block text-[12px] font-bold text-slate-400 uppercase tracking-wider ml-1 group-focus-within:text-slate-900 transition-colors">Contraseña</label>
        </div>
        <input type="password" [(ngModel)]="password" 
          class="w-full h-11 rounded-lg border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm text-slate-900 placeholder:text-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-950 focus:bg-white transition-all"
          placeholder="••••••••">
      </div>

      <button (click)="login()" [disabled]="loading"
        class="w-full flex justify-center items-center gap-2 bg-slate-950 text-white font-semibold text-sm h-11 rounded-lg hover:bg-slate-800 focus:ring-4 focus:ring-slate-200 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm mt-3">
        {{ loading ? 'Validando Identidad...' : 'Entrar al Sistema' }}
      </button>
    </div>

    <div *ngIf="error" class="mt-6 flex items-center gap-3 p-4 rounded-xl bg-red-50 border border-red-100 animate-in fade-in slide-in-from-top-2 duration-300">
      <div class="flex-shrink-0 w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center text-xs">!</div>
      <p class="text-xs font-bold text-red-600 leading-tight">
        {{ error }}
      </p>
    </div>
    
  </div> <div class="mt-10 text-center">
    <p class="text-xs text-slate-400 font-medium tracking-wider uppercase">
      Powered by InclusionScore Intelligence
    </p>
  </div>

</div>
