<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
  
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 transform transition-all hover:scale-[1.01]">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">InclusionScore AI</h2>
      <p class="text-sm text-gray-500 mt-2">Acceso seguro para Corresponsales</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 ml-1">username</label>
        <input type="username" [(ngModel)]="username" 
          class="w-full px-4 py-3 mt-1 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
          placeholder="tu@correo.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 ml-1">Password</label>
        <input type="password" [(ngModel)]="password" 
          class="w-full px-4 py-3 mt-1 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
          placeholder="••••••••">
      </div>

      <button (click)="login()" [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 disabled:opacity-50">
        {{ loading ? 'Autenticando...' : 'Entrar al Sistema' }}
      </button>
    </div>

    <p *ngIf="error" class="mt-4 text-center text-sm font-semibold text-red-500 bg-red-50 p-2 rounded-lg italic border border-red-100">
      ⚠️ {{ error }}
    </p>
  </div>
</div>
