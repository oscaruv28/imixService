<div class="min-h-screen bg-slate-50 flex flex-col items-center pt-6 px-4 md:pt-12 font-sans text-slate-900">
  
  <div class="w-full max-w-md flex flex-col gap-4">

    <div class="flex justify-between items-center px-2 mb-2">
      <div class="flex items-center gap-2">
        <div class="flex size-7 items-center justify-center rounded bg-slate-900 text-white shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 2h10"></path><path d="M5 6h14"></path><rect width="18" height="12" x="3" y="10" rx="2"></rect>
          </svg>
        </div>
        <h1 class="text-lg font-semibold tracking-tight">InclusionScore <span class="text-slate-400 font-normal">AI</span></h1>
      </div>
      <button (click)="logout()" class="text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">
        Cerrar Sesión
      </button>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <h2 class="text-xl font-semibold tracking-tight mb-1">Solicitud de Crédito</h2>
      <p class="text-sm text-slate-500 mb-6">Ingrese el monto para el análisis de riesgo.</p>

      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Monto Solicitado (COP)</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-400 text-sm">$</span>
            <input type="number" [(ngModel)]="monto" 
              class="w-full pl-8 pr-3 py-2 bg-slate-50/50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition-all"
              placeholder="0.00">
          </div>
        </div>

        <button (click)="enviar()" [disabled]="loading || monto <= 0"
          class="w-full flex justify-center items-center gap-2 bg-slate-900 text-white font-medium text-sm py-2.5 rounded-lg hover:bg-slate-800 focus:ring-4 focus:ring-slate-200 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
          <span *ngIf="loading" class="animate-spin inline-block size-4 border-2 border-white border-t-transparent rounded-full"></span>
          {{ loading ? 'Analizando...' : 'Procesar con IA' }}
        </button>
      </div>
    </div>

    <div *ngIf="resultado" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 animate-in fade-in slide-in-from-bottom-2 duration-300">
      <h3 class="font-medium text-sm text-slate-900 mb-4 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        Resultado del Análisis
      </h3>
      
      <div class="flex flex-col gap-3">
        
        <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-lg">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Estado</span>
          <span class="text-sm font-medium text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md capitalize">
            {{ resultado.status }}
          </span>
        </div>

        <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-lg">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Monto Autorizado</span>
          <span class="text-sm font-semibold text-slate-900">
            ${{ resultado.amount | number }}
          </span>
        </div>

      </div>
      
      <div class="mt-5 pt-4 border-t border-slate-100">
        <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-2">ID de Transacción</p>
        <p class="text-xs font-mono text-slate-600 break-all bg-slate-50 p-2.5 rounded-md border border-slate-100">
          {{ resultado.id }}
        </p>
      </div>
    </div>

  </div>
</div>
